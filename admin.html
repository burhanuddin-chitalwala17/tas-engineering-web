<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · T.A.S. Engineering Co.</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{background:var(--ink);color:#c4cad8;padding:20px 14px;display:grid;gap:6px;align-content:start;position:sticky;top:0;height:100vh}
  .side .logo b{color:#fff}
  .side button{background:none;border:0;color:#c4cad8;text-align:left;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;font-size:.95rem}
  .side button[aria-current="true"]{background:#24304d;color:#fff;box-shadow:inset 3px 0 0 var(--red)}
  .side .pill{background:var(--red);color:#fff;font-family:var(--mono);font-size:.72rem;padding:0 7px;border-radius:9px}
  .mainp{padding:28px clamp(16px,3vw,40px) 80px;display:grid;gap:24px;align-content:start;min-width:0}
  .panel{background:var(--card);border:1px solid var(--line);padding:22px;display:grid;gap:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);padding:16px;display:grid;gap:4px}
  .stat b{font-family:var(--display);font-size:2.2rem;font-variation-settings:"wdth" 70;line-height:1}
  .tbl{overflow-x:auto;border:1px solid var(--line)}
  .tbl table{min-width:1180px}
  .tbl td:first-child input{min-width:220px}
  .tbl td input,.tbl td select{padding:6px 8px;font-size:.88rem}
  .tbl td{padding:6px 8px;vertical-align:middle}
  .rowbtn{background:none;border:0;color:var(--red);cursor:pointer;font-size:.85rem}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .note{background:#fff7d6;border:1px solid #f0d57a;color:#4a3b00;padding:12px 14px;font-size:.88rem}
  .thumb{width:56px;height:56px;object-fit:cover;border:1px solid var(--line)}
  .login{min-height:100vh;display:grid;place-items:center;padding:16px}
  .login form{background:var(--card);border:1px solid var(--line);padding:28px;display:grid;gap:14px;width:min(380px,100%)}
  @media (max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}.side .logo{display:none}.grid2,.stats{grid-template-columns:1fr 1fr}}
  @media (max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
    <a class="logo" href="index.html"><span class="badge">TAS</span><b>Admin panel</b></a>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn red" type="submit">Sign in</button>
    <p class="muted" style="font-size:.82rem"><span class="demo-tag">DEMO</span>Password: <span class="mono">tas2026</span>. The live panel uses proper logins for the owner and staff.</p>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="side">
    <a class="logo" href="index.html" target="_blank" style="margin-bottom:14px"><span class="badge">TAS</span><b>Admin</b></a>
    <button data-tab="dash" aria-current="true">Overview</button>
    <button data-tab="leads">Leads <span class="pill" id="newCount">0</span></button>
    <button data-tab="products">Products &amp; prices</button>
    <button data-tab="import">Upload price list</button>
    <button data-tab="business">Business details</button>
    <button data-tab="banner">Banner message</button>
    <button data-tab="demo">Demo settings</button>
  </aside>
  <main class="mainp" id="view"></main>
</div>

<div id="slip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
